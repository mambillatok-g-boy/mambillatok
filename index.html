<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MambillaTok - Cameroon TikTok</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;height:100vh;overflow:hidden}
.top{position:fixed;top:0;width:100%;text-align:center;padding:15px;background:linear-gradient(to bottom,rgba(0,0,0,0.9),transparent);z-index:10;font-weight:bold;font-size:20px}
.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.post{height:100vh;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover}
.info{position:absolute;bottom:90px;left:15px;z-index:2}
.user{font-weight:bold;font-size:18px;text-shadow:1px 1px 3px #000}
.caption{margin-top:5px;font-size:15px;text-shadow:1px 1px 3px #000;max-width:75vw}
.actions{position:absolute;right:15px;bottom:120px;display:flex;flex-direction:column;gap:20px;z-index:2}
.btn{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer}
.goAdmin{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ff0050;padding:10px 20px;border-radius:20px;z-index:20;text-decoration:none;color:#fff;font-weight:bold}
.error-box{padding:100px 20px;text-align:center}
</style>
</head>
<body>
<div class="top">MambillaTok 🇨🇲</div>
<div class="feed" id="feed"><div class="error-box">Loading...</div></div>
<a class="goAdmin" href="/admin.html">+ Upload</a>
<script>
const SUPA_URL="https://vtytewadmmufjpizopjf.supabase.co";
const SUPA_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0eXRld2FkbW11ZmpwbHpvcGpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMDg4NTMsImV4cCI6MjEwODg4NDg1M30.teqlRKU9Gh3nTK9lzxVb-kBPDAMc8nPDO-FHF7MR2Ok";
async function load(){
 const feed=document.getElementById('feed');
 try{
  const res=await fetch(`${SUPA_URL}/rest/v1/videos?select=*&order=created_at.desc`,{headers:{"apikey":SUPA_ANON,"Authorization":`Bearer ${SUPA_ANON}`}});
  if(!res.ok) throw new Error(`DB Error ${res.status} - Check table videos exists!`);
  const data=await res.json();
  if(!data||data.length===0){feed.innerHTML=`<div class="error-box"><h2>No videos yet 🎥</h2><p>Go to <a href="/admin.html" style="color:#ff0050">/admin.html</a> to upload!</p></div>`;return;}
  feed.innerHTML='';data.forEach(v=>{
   const div=document.createElement('div');div.className='post';
   div.innerHTML=`<video src="${v.video_url}" loop playsinline onclick="this.paused?this.play():this.pause()"></video><div class="info"><div class="user">@${v.username||'mambilla'}</div><div class="caption">${v.caption||''}</div></div><div class="actions"><div class="btn">❤️</div><div class="btn">💬</div><div class="btn">↗️</div></div>`;
   feed.appendChild(div);
  });
  feed.querySelector('video')?.play().catch(()=>{});
  feed.addEventListener('scroll',()=>{document.querySelectorAll('video').forEach(v=>{const r=v.getBoundingClientRect();if(r.top>=0&&r.top<400)v.play().catch(()=>{});else v.pause();});});
 }catch(e){feed.innerHTML=`<div class="error-box"><h2>❌ ${e.message}</h2><p><a href="/admin.html" style="color:#ff0050">Go to Admin</a></p></div>`;}
}
load();
</script>
</body>
</html>
