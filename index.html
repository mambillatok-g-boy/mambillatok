<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MambillaTok - Cameroon TikTok LIVE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#000;color:#fff;height:100vh;overflow:hidden}
#loader{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center}
#loader h1{font-size:44px;font-weight:900} #loader h1 span{color:#fe2c55}
.bar{width:200px;height:3px;background:#222;margin-top:20px;border-radius:10px;overflow:hidden} .bar div{height:100%;width:0%;background:#fe2c55;animation:load 2s forwards} @keyframes load{to{width:100%}}
#auth{position:fixed;inset:0;background:#000;z-index:1000;display:none;overflow-y:auto;padding:20px}
.auth-box{max-width:380px;margin:20px auto;background:#121212;border:1px solid #222;border-radius:20px;padding:24px}
.auth-box input,.auth-box select{width:100%;padding:14px;background:#000;border:1px solid #333;border-radius:12px;color:#fff;margin-bottom:12px}
.btn{width:100%;padding:14px;border-radius:30px;border:none;font-weight:700;cursor:pointer} .btn-main{background:#fe2c55;color:#fff} .btn-white{background:#fff;color:#000;margin-top:10px}
.avatar-preview{width:80px;height:80px;border-radius:50%;background:#222;margin:0 auto 12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:32px} .avatar-preview img{width:100%;height:100%;object-fit:cover}
#app{display:flex;height:100vh} #feed{flex:1;position:relative}
.video-card{position:absolute;inset:0;display:none} .video-card.active{display:flex} .video-card video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,transparent 45%);display:flex;flex-direction:column;justify-content:space-between;padding:14px}
.right-actions{position:absolute;right:10px;bottom:130px;display:flex;flex-direction:column;gap:18px;align-items:center}
.action{width:50px;height:50px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;flex-direction:column}
.action b{font-size:11px;margin-top:2px}
.profile-bubble{width:54px;height:54px;border-radius:50%;border:2px solid #fff;overflow:hidden;background:#222} .profile-bubble img{width:100%;height:100%;object-fit:cover}
.bottom-info{max-width:72%}
.bottom-nav{position:absolute;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0 20px;z-index:10}
.nav-item{color:#666;text-align:center;font-size:11px;cursor:pointer} .nav-item.active{color:#fff} .nav-item div{font-size:22px}
.page{position:fixed;inset:0;background:#000;z-index:500;display:none;overflow-y:auto;padding:20px 16px 90px} .page.active{display:block}
.card{background:#121212;border:1px solid #222;border-radius:16px;padding:16px;margin-bottom:14px}
</style>
</head>
<body>
<div id="loader"><h1>Mambilla<span>Tok</span></h1><p style="color:#888;margin-top:6px">Cameroon • Mambilla • Supabase LIVE</p><div class="bar"><div></div></div></div>

<div id="auth"><div class="auth-box">
<div class="avatar-preview" id="avatarPrev">👤</div>
<h2>Join MambillaTok 🇨🇲</h2>
<input id="regName" placeholder="Full Name">
<input id="regUser" placeholder="@username e.g @cameroon_girl">
<select id="regCountry"><option value="Cameroon" selected>🇨🇲 Cameroon</option><option value="Nigeria">🇳🇬 Nigeria</option><option value="Mambilla">🏔️ Mambilla Plateau</option><option value="Ghana">🇬🇭 Ghana</option></select>
<input id="regPic" type="file" accept="image/*" onchange="previewPic(this)">
<input id="regEmail" type="email" placeholder="Email">
<input id="regPass" type="password" placeholder="Password">
<button class="btn btn-main" onclick="doRegister()">Create Account (Supabase)</button>
<button class="btn btn-white" onclick="doLogin()">Login</button>
</div></div>

<div id="app"><div id="feed"></div>
<div class="bottom-nav">
<div class="nav-item active" onclick="showTab('home')"><div>⌂</div>Home</div>
<div class="nav-item" onclick="showTab('upload')"><div style="background:#fe2c55;color:#fff;width:36px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin:0 auto">+</div>Post</div>
<div class="nav-item" onclick="showTab('earn')"><div>$</div>Earn</div>
<div class="nav-item" onclick="showTab('profile')"><div>☺</div>Profile</div>
</div></div>

<div id="uploadPage" class="page"><h2>Upload to Supabase</h2><div class="card" style="margin-top:16px"><input id="vidTitle" placeholder="Caption #mambilla #cameroon"><input id="vidFile" type="file" accept="video/*" style="margin-top:12px"><button class="btn btn-main" style="margin-top:12px" onclick="uploadVideo()">Post Video LIVE</button><p id="upStatus" style="color:#888;font-size:12px;margin-top:10px"></p></div><button class="btn btn-white" onclick="showTab('home')">Back to Feed</button></div>
<div id="earnPage" class="page"><h2>Monetization</h2><div class="card" style="margin-top:16px"><small style="color:#888">TOTAL EARNINGS</small><div style="font-size:30px;font-weight:800;color:#00f2ea">$<span id="earnTotal">0.00</span></div><p style="color:#888;font-size:13px;margin-top:6px">Supabase tracked: 1000 views = $0.50</p></div><button class="btn btn-white" onclick="showTab('home')">Back</button></div>
<div id="profilePage" class="page"><div style="text-align:center;padding-top:20px"><div id="myAvatar" class="avatar-preview" style="width:100px;height:100px">👤</div><h2 id="myName">@user</h2><p id="myCountry" style="color:#888">Cameroon</p><p id="myEmail" style="color:#555;font-size:12px;margin-top:4px"></p><button class="btn btn-white" style="margin-top:18px" onclick="logout()">Logout</button><div style="margin-top:20px"><a href="admin.html" style="color:#fe2c55">CEO Admin Panel → admin.html</a></div></div></div>

<script>
const SUPABASE_URL = 'https://vtytewadmmufjplzopjf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_RtgoaL248SZgC6bq6FXz3A_gGHQN0Yt';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser=null, videos=[], curIndex=0;
async function init(){
 setTimeout(()=>document.getElementById('loader').style.display='none',2000);
 const {data:{session}} = await supabase.auth.getSession();
 if(session){ currentUser=session.user; document.getElementById('auth').style.display='none'; loadProfile(); } else { document.getElementById('auth').style.display='block'; }
 await loadVideos();
}
function previewPic(input){const r=new FileReader(); r.onload=e=>{document.getElementById('avatarPrev').innerHTML=`<img src="${e.target.result}">`; document.getElementById('avatarPrev').dataset.img=e.target.result;}; r.readAsDataURL(input.files[0]);}
async function doRegister(){
 const name=document.getElementById('regName').value, username=document.getElementById('regUser').value, country=document.getElementById('regCountry').value, email=document.getElementById('regEmail').value, pass=document.getElementById('regPass').value;
 const avatar=document.getElementById('avatarPrev').dataset.img||'';
 if(!email||!pass) return alert('Enter email & password');
 document.getElementById('auth').innerHTML='<div class=auth-box><p>Creating account...</p></div>';
 const {data,error} = await supabase.auth.signUp({email,password:pass,options:{data:{full_name:name,username,country,avatar}}});
 if(error){alert(error.message); location.reload(); return;}
 alert('Account created! Now login. Cameroon joined! 🇨🇲'); location.reload();
}
async function doLogin(){
 const email=document.getElementById('regEmail').value, pass=document.getElementById('regPass').value;
 const {data,error}=await supabase.auth.signInWithPassword({email,password:pass});
 if(error) return alert(error.message);
 currentUser=data.user; document.getElementById('auth').style.display='none'; loadProfile();
}
async function loadProfile(){
 if(!currentUser) return;
 const m=currentUser.user_metadata||{};
 document.getElementById('myName').innerText=(m.username||'user')+' - '+(m.full_name||'User');
 document.getElementById('myCountry').innerText=m.country||'Cameroon';
 document.getElementById('myEmail').innerText=currentUser.email;
 if(m.avatar) document.getElementById('myAvatar').innerHTML=`<img src="${m.avatar}">`;
}
async function loadVideos(){
 const {data,error}=await supabase.from('videos').select('*').order('created_at',{ascending:false}).limit(50);
 if(error){ console.log(error); document.getElementById('feed').innerHTML='<p style=padding:40px>Run SQL: create table videos...</p>'; return; }
 videos=data&&data.length?data:[{full_name:'Mambilla Girl',username:'@mambilla',country:'Mambilla',caption:'Welcome to MambillaTok! #mambilla #cameroon',avatar_url:'https://i.pravatar.cc/150?img=5',video_url:'https://www.w3schools.com/html/mov_bbb.mp4',likes:124}];
 renderFeed();
}
function renderFeed(){
 const feed=document.getElementById('feed'); feed.innerHTML='';
 videos.forEach((v,i)=>{
  const card=document.createElement('div'); card.className='video-card'+(i===curIndex?' active':'');
  card.innerHTML=`<video loop playsinline ${i===0?'autoplay':''} src="${v.video_url}" onclick="this.paused?this.play():this.pause()"></video><div class="overlay"><div style="display:flex;justify-content:space-between"><b>MambillaTok • LIVE</b><small>Supabase</small></div><div style="display:flex;justify-content:space-between;align-items:end"><div class="bottom-info"><h4>${v.full_name||v.username} ${v.country==='Cameroon'?'🇨🇲':''}</h4><p>${v.username} • ${v.country}</p><p>${v.caption||''}</p></div><div class="right-actions"><div class="profile-bubble"><img src="${v.avatar_url||'https://i.pravatar.cc/150?img=3'}"></div><div class="action" onclick="likeVid(${i})">❤<b>${v.likes||0}</b></div><div class="action">💬<b>12</b></div><div class="action">↗</div><div class="action" onclick="nextVid()">⏭</div></div></div></div>`;
  feed.appendChild(card);
 });
}
function nextVid(){document.querySelectorAll('.video-card')[curIndex]?.querySelector('video')?.pause(); curIndex=(curIndex+1)%videos.length; renderFeed();}
async function likeVid(i){videos[i].likes=(videos[i].likes||0)+1; renderFeed(); if(videos[i].id) await supabase.from('videos').update({likes:videos[i].likes}).eq('id',videos[i].id);}
function showTab(tab){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); if(tab==='upload')document.getElementById('uploadPage').classList.add('active'); if(tab==='earn')document.getElementById('earnPage').classList.add('active'); if(tab==='profile')document.getElementById('profilePage').classList.add('active');}
async function uploadVideo(){
 const title=document.getElementById('vidTitle').value||'Mambilla video'; const file=document.getElementById('vidFile').files[0];
 if(!file) return alert('Select video'); document.getElementById('upStatus').innerText='Uploading to Supabase...';
 const fileName=Date.now()+'_'+file.name.replace(/\s/g,'_');
 const {data:upData,error:upErr}=await supabase.storage.from('videos').upload(fileName,file);
 if(upErr){document.getElementById('upStatus').innerText='Error: '+upErr.message+' - Create bucket videos (public) in Storage'; return alert(upErr.message);}
 const {data:urlData}=supabase.storage.from('videos').getPublicUrl(fileName);
 const video_url=urlData.publicUrl; const meta=currentUser?.user_metadata||{};
 const {error}=await supabase.from('videos').insert({username:meta.username||'@you',full_name:meta.full_name||'You',country:meta.country||'Cameroon',caption:title,video_url,avatar_url:meta.avatar||'',likes:0});
 if(error) return alert(error.message);
 document.getElementById('upStatus').innerText='Posted!'; alert('Posted LIVE! 🔥'); await loadVideos(); showTab('home');
}
async function logout(){await supabase.auth.signOut(); location.reload();}
init();
</script>
</body>
</html>
