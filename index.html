<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fe2c55">
<title>MambillaTok - Cameroon TikTok</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto; overflow:hidden}
#app{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.video-card{height:100vh;width:100vw;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.video-card video{height:100%;width:100%;object-fit:cover}
.info{position:absolute;bottom:100px;left:15px;right:80px;z-index:2}
.info h3{font-size:18px;margin-bottom:5px}
.info p{font-size:14px;opacity:0.8}
.actions{position:absolute;right:10px;bottom:120px;display:flex;flex-direction:column;gap:20px;z-index:2}
.action-btn{width:50px;height:50px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer}
.header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:center;gap:20px;padding:15px;background:linear-gradient(to bottom, rgba(0,0,0,0.7), transparent)}
.header span{font-weight:bold;opacity:0.6}
.header span.active{opacity:1;border-bottom:2px solid #fe2c55}
.logo{position:fixed;top:12px;left:15px;z-index:11;font-weight:900;font-size:20px}
.logo span{color:#fe2c55}
.loading{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.loading h1{font-size:32px;font-weight:900}
.loading h1 span{color:#fe2c55}
.loading p{margin-top:10px;opacity:0.7}
</style>
</head>
<body>
<div class="logo">Mambilla<span>Tok</span></div>
<div class="header"><span class="active">For You</span><span>Following</span></div>
<div id="app">
  <div class="loading">
    <h1>Mambi<span>llaTok</span></h1>
    <p>Cameroon • Mambilla • Supabase LIVE</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://fbtqzprptmnuyfyrhprj.supabase.co";
const SUPABASE_KEY = "sb_publishable_hB3Ppo5u4eKCb3t9aH_3Yw_HRz8Yj3R";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadVideos(){
  const { data, error } = await supabase.from('videos').select('*').order('created_at', {ascending:false});
  if(error){ document.getElementById('app').innerHTML = '<div class="loading"><h1>Error loading</h1><p>'+error.message+'</p></div>'; return; }
  if(!data || data.length===0){
    document.getElementById('app').innerHTML = '<div class="loading"><h1>Mambi<span>llaTok</span></h1><p>No videos yet. Go to /admin.html to upload first video!</p></div>';
    return;
  }
  let html = "";
  data.forEach(v => {
    html += `
    <div class="video-card">
      <video src="${v.video_url}" loop playsinline onclick="this.paused?this.play():this.pause()"></video>
      <div class="info">
        <h3>@${v.username || 'mambilla'}</h3>
        <p>${v.caption || ''}</p>
      </div>
      <div class="actions">
        <div class="action-btn">❤️</div>
        <div class="action-btn">💬</div>
        <div class="action-btn">↗️</div>
      </div>
    </div>`;
  });
  document.getElementById('app').innerHTML = html;
  const vids = document.querySelectorAll('video');
  let observer = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){ e.target.play().catch(()=>{}); }
      else{ e.target.pause(); }
    });
  }, {threshold:0.7});
  vids.forEach(v=>observer.observe(v));
}
loadVideos();
</script>
</body>
</html>
